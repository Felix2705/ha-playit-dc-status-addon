title: Playit Dashboard (Auto)
path: playit-dashboard-auto
icon: mdi:shield-server
# Requires resources: button-card and auto-entities
cards:
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: header_time
        entity: sensor.playit_last_updated
      - type: custom:button-card
        template: header_refresh
  - type: custom:auto-entities
    card:
      type: entities
      title: Melder
      show_header_toggle: false
    filter:
      include:
        - domain: sensor
          entity_id: "sensor.playit_status_region_*"
    sort:
      method: state
      numeric: false
    card_options:
      type: entities
      show_header_toggle: false
      state_color: true
      entities:
        - entity: sensor.playit_status_overall

# This view uses `custom:auto-entities` to auto-generate rows for any
# entity matching `sensor.playit_status_region_*`. Each row can be
# displayed as a `custom:button-card` by replacing `card` and `card_options`
# with custom rendering (requires advanced YAML templates). The goal is an
# automated list of regions without manual editing when sensors change.
