name: "Playit DC Status"
description: "Polls Playit.gg status and logs results as a Supervisor add-on."
version: "0.1.0"
slug: "playit_status"
startup: "services"
boot: "auto"
host_network: false
homeassistant_api: false
hassio_api: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - config:rw
options:
  status_url: "https://dc.status.playit.gg/"
  interval: 60
schema:
  status_url: str
  interval: int
