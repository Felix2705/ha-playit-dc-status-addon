name: "Playit DC Status"
description: "Polls Playit.gg status and exposes a web UI in Home Assistant ingress."
version: "0.1.3-beta"
slug: "playit_status"
startup: "services"
boot: "auto"
host_network: false
homeassistant_api: false
hassio_api: false
ingress: true
ingress_port: 8080
panel_icon: mdi:server-network
panel_title: Playit Status
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - config:rw
options:
  status_url: "https://dc.status.playit.gg/"
  interval: 60
schema:
  status_url: str
  interval: int
