# Advanced Lovelace view mimicking the provided UI. Requires custom:button-card.
# Add the following resource to Lovelace (Settings -> Dashboards -> Resources):
# URL: /hacsfiles/button-card/button-card.js  (or the manual install path)
# Type: module

title: Playit Dashboard
path: playit-dashboard
icon: mdi:shield-server
cards:
  - type: markdown
    content: |
      ## MAP5000 Dashboard
      <span style="background:#16a34a;color:#fff;padding:4px 8px;border-radius:12px">MAP5000 erreichbar</span>
    style: |
      ha-card {
        background: transparent;
      }

  - type: horizontal-stack
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            template: header_time
            entity: sensor.playit_status_overall
          - type: custom:button-card
            template: header_refresh
            tap_action:
              action: call-service
              service: script.playit_refresh
      - type: entities
        title: Bereiche
        show_header_toggle: false
        entities:
          - entity: sensor.playit_status_region_DC_West
            name: 1.1.ControlPanelArea.1.1
            secondary_info: last-changed

  - type: markdown
    content: '---'

  - type: entities
    title: Melder
    show_header_toggle: false
    entities:
      - type: custom:button-card
        template: region_row
        name: BE_1_Sabotage
        label: 'Frei'
        show_state: true
      - type: custom:button-card
        template: region_row
        name: MAP_Sabotage
        label: 'Frei'
        show_state: true
      - type: custom:button-card
        template: region_row
        name: BM_2_1_Buero
        label: 'Frei'
        show_state: true

# Button-card templates (add as part of raw Lovelace resources/templates)
# Example templates to add in Raw config editor under 'button_card_templates':
# button_card_templates:
#   header_time:
#     show_name: true
#     name: 'MAP5000 Dashboard'
#     show_state: true
#     state:
#       - value: 'operational'
#         color: green
#   header_refresh:
#     show_name: false
#     show_icon: true
#     icon: mdi:refresh
#   region_row:
#     show_name: true
#     show_state: true
#     color: auto

# NOTES: This is a starting point. To fully match the screenshot, install and use
# `button-card` and adjust templates, icons, colors and layout. The `entities` card
# can contain `custom:button-card` entries as shown above.
